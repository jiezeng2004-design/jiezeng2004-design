name: Refresh profile README

on:
  schedule:
    - cron: "20 0 * * 1"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-readme-refresh
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out profile repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Refresh bounded README sections
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 .github/scripts/update_profile.py

      - name: Commit when profile data changed
        shell: bash
        run: |
          if git diff --quiet -- README.md; then
            echo "Profile README is already current."
            exit 0
          fi

          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "docs: refresh profile data"
          git push
