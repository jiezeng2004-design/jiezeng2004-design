name: Generate contribution signal

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate contribution SVGs
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=%23245DDB&color_dots=%23E8EDFC,%23BBCBFA,%23769AF2,%233E6FE2,%23245DDB
            dist/github-contribution-grid-snake-dark.svg?color_snake=%23769AF2&color_dots=%23171A23,%23212B4E,%232F4B91,%234B72D7,%23769AF2

      - name: Publish generated SVGs
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
