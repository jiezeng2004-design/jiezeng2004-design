<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="180" viewBox="0 0 1200 180" role="img" aria-labelledby="title desc">
  <title id="title">GitHub 数据快照</title><desc id="desc">截至 2026-07-31，共有 34 个公开仓库、9 个原创项目、5 个星标和 2 位关注者。</desc>
  <rect width="1200" height="180" fill="#fff" stroke="#d8d9d3" /><text x="32" y="42" fill="#245ddb" font-family="'Microsoft YaHei','PingFang SC',ui-monospace,Consolas,monospace" font-size="12" font-weight="700" letter-spacing="1.5">GitHub 数据快照</text><text x="1168" y="42" fill="#71766f" text-anchor="end" font-family="ui-monospace,Consolas,monospace" font-size="11">2026-07-31</text><line x1="32" y1="60" x2="1168" y2="60" stroke="#d8d9d3" />
  <g font-family="'Microsoft YaHei','PingFang SC',Arial,sans-serif"><text x="32" y="111" fill="#171717" font-size="38" font-weight="800">34</text><text x="32" y="140" fill="#646861" font-size="12">公开仓库</text><text x="328" y="111" fill="#171717" font-size="38" font-weight="800">9</text><text x="328" y="140" fill="#646861" font-size="12">原创项目</text><text x="617" y="111" fill="#171717" font-size="38" font-weight="800">5</text><text x="617" y="140" fill="#646861" font-size="12">累计星标</text><text x="888" y="111" fill="#171717" font-size="38" font-weight="800">2</text><text x="888" y="140" fill="#646861" font-size="12">关注者</text></g><circle cx="1142" cy="116" r="8" fill="#245ddb" class="blink" /><style>.blink{animation:blink 2.8s steps(1) infinite}@keyframes blink{0%,80%,100%{opacity:1}81%,88%{opacity:.25}}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style>
