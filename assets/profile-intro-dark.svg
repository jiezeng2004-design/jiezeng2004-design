<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="172" viewBox="0 0 1200 172" role="img" aria-labelledby="title desc">
  <title id="title">Focus areas</title><desc id="desc">Controllable agents, local-first AI, and auditable software delivery.</desc>
  <rect width="1200" height="172" fill="#151a18" stroke="#343b43" /><text x="32" y="40" fill="#769af2" font-family="ui-monospace,Consolas,monospace" font-size="12" font-weight="700" letter-spacing="2">01 / CURRENT FOCUS</text><line x1="32" y1="58" x2="1168" y2="58" stroke="#343b43" />
  <g font-family="Arial,sans-serif"><text x="32" y="103" fill="#f2f3ef" font-size="24" font-weight="700">Controllable agents</text><text x="32" y="132" fill="#aeb6b1" font-size="14">Scoped execution with independent verification.</text><text x="425" y="103" fill="#f2f3ef" font-size="24" font-weight="700">Local-first AI</text><text x="425" y="132" fill="#aeb6b1" font-size="14">Keep work, context, and decisions close to the source.</text><text x="814" y="103" fill="#f2f3ef" font-size="24" font-weight="700">Auditable delivery</text><text x="814" y="132" fill="#aeb6b1" font-size="14">Make changes inspectable before they become trusted.</text></g><line x1="394" y1="78" x2="394" y2="146" stroke="#343b43" /><line x1="784" y1="78" x2="784" y2="146" stroke="#343b43" />
</svg>
