<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="172" viewBox="0 0 1200 172" role="img" aria-labelledby="title desc">
  <title id="title">当前方向</title><desc id="desc">聚焦可控智能体、本地优先 AI 与可审计的软件交付。</desc>
  <rect width="1200" height="172" fill="#151a18" stroke="#343b43" /><text x="32" y="40" fill="#769af2" font-family="'Microsoft YaHei','PingFang SC',ui-monospace,Consolas,monospace" font-size="12" font-weight="700" letter-spacing="1.5">01 / 当前方向</text><line x1="32" y1="58" x2="1168" y2="58" stroke="#343b43" />
  <g font-family="'Microsoft YaHei','PingFang SC',Arial,sans-serif"><text x="32" y="103" fill="#f2f3ef" font-size="24" font-weight="700">可控智能体</text><text x="32" y="132" fill="#aeb6b1" font-size="14">范围受控，并接受独立验证。</text><text x="425" y="103" fill="#f2f3ef" font-size="24" font-weight="700">本地优先 AI</text><text x="425" y="132" fill="#aeb6b1" font-size="14">让工作、上下文和决策靠近源头。</text><text x="814" y="103" fill="#f2f3ef" font-size="24" font-weight="700">可审计交付</text><text x="814" y="132" fill="#aeb6b1" font-size="14">先让变更可检查，再让结果被信任。</text></g><line x1="394" y1="78" x2="394" y2="146" stroke="#343b43" /><line x1="784" y1="78" x2="784" y2="146" stroke="#343b43" />
</svg>
